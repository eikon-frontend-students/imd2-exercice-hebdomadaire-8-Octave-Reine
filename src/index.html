<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Exercice hebdomadaire 8</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="card">
      <div class="item">
        <img class="item-img" src="img/Product picture.png" alt="Brocoli" />
        <div class="item-text">
          <div class="item-name">Brocoli</div>
          <div class="item-sub">en stock</div>
        </div>
        <div class="item-price">CHF 4.35</div>
      </div>

      <div class="item">
        <img
          class="item-img"
          src="img/Product picture-1.png"
          alt="Le Gruyère"
        />
        <div class="item-text">
          <div class="item-name">Le Gruyère</div>
          <div class="item-sub">en stock</div>
        </div>
        <div class="item-price">CHF 11.00</div>
      </div>

      <div class="item">
        <img
          class="item-img"
          src="img/Product picture-2.png"
          alt="Carottes mini"
        />
        <div class="item-text">
          <div class="item-name">Carottes mini</div>
          <div class="item-sub">plus que 1 en stock</div>
        </div>
        <div class="item-price">CHF 5.20</div>
      </div>

      <div class="item">
        <img
          class="item-img"
          src="img/Product picture-3.png"
          alt="Chips paprika Zweifel"
        />
        <div class="item-text">
          <div class="item-name">Chips paprika<br />Zweifel</div>
          <div class="item-sub">en stock</div>
        </div>
        <div class="item-price">CHF 5.95</div>
      </div>

      <button class="checkout">Passer à la caisse</button>
    </div>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
